name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Windows build, lint and tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install interface dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build the interface
        run: pnpm build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The runner's default temp folder is reached through an 8.3 short name
      # (C:\Users\RUNNER~1\...), which the catalog stores under its long name; use a plain path.
      - name: Tests
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'cairn-tests'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $env:TMP = $tmp
          $env:TEMP = $tmp
          cargo test --workspace --no-fail-fast
