[workspace]
resolver = "2"
members = [
  "crates/aegis-core",
  "crates/aegis-embed",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = "1"
ignore = "0.4"
jwalk = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
ts-rs = { version = "12", features = ["serde-compat"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
